server {
    listen 8080;
    server_name localhost;

    # Cloud Run forwards the original protocol in this header.
    # If the visitor used http://, redirect them to https://.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html; # 👈 This line fixes the 404s
    }

    # Optional: Cache static asset
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public";
    }
}